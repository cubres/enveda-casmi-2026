<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="780" viewBox="0 0 1320 780">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55708b"/></marker></defs>
<rect width="1320" height="780" rx="24" fill="#f4f7fb"/>
<g font-family="Arial, sans-serif" fill="#16324b">
<text x="56" y="62" font-size="34" font-weight="700">A readable container is the first contract</text>
<text x="56" y="98" font-size="19" fill="#536779">Offline inspection without model loading or pickle interpretation</text>

<rect x="56" y="150" width="350" height="184" rx="15" fill="#e7effa" stroke="#b7cae1"/>
<text x="80" y="185" font-size="23" font-weight="700">Checkpoint files</text>
<text x="80" y="220" font-size="18">fp-v2: two .pt files</text>
<text x="80" y="250" font-size="18">144,110,255 bytes each</text>
<text x="80" y="284" font-size="17" fill="#536779">Historical receipt: Torch ZIP</text>
<text x="80" y="311" font-size="17" fill="#536779">data.pkl stays opaque</text>

<rect x="56" y="365" width="350" height="184" rx="15" fill="#e7effa" stroke="#b7cae1"/>
<text x="80" y="400" font-size="23" font-weight="700">Companion arrays</text>
<text x="80" y="435" font-size="18">Bounded numeric NPY header</text>
<text x="80" y="465" font-size="18">Shape, dtype and declared bytes</text>
<text x="80" y="499" font-size="17" fill="#536779">fp_bits: reported (6930,), int64</text>
<text x="80" y="526" font-size="17" fill="#536779">Values and bit order stay unchecked</text>

<path d="M406 242H462V335H505" fill="none" stroke="#55708b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M406 457H462V371H505" fill="none" stroke="#55708b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="505" y="230" width="305" height="234" rx="15" fill="#e0f2ed" stroke="#97c6b9"/>
<text x="531" y="270" font-size="23" font-weight="700">Bounded records</text>
<text x="531" y="308" font-size="18">At most 512 archive members</text>
<text x="531" y="341" font-size="18">5 MiB total metadata reads</text>
<text x="531" y="374" font-size="18">8 KiB numeric-array header</text>
<text x="531" y="408" font-size="18">No model or pickle loading</text>
<text x="531" y="440" font-size="17" fill="#3b7161">Standard-library Python only</text>

<path d="M810 347H867" fill="none" stroke="#55708b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="867" y="230" width="397" height="234" rx="15" fill="#ffffff" stroke="#bbc8d5"/>
<text x="895" y="270" font-size="23" font-weight="700">Metadata result</text>
<text x="895" y="308" font-size="19">PASS: supported bounded syntax</text>
<text x="895" y="340" font-size="19">HOLD: opaque or malformed</text>
<text x="895" y="370" font-size="18">or outside an explicit limit</text>
<text x="895" y="401" font-size="17" fill="#536779">No full-file hash or tensor CRC</text>
<text x="895" y="427" font-size="17" fill="#536779">A clean header is a useful diagnosis</text>
<text x="895" y="451" font-size="17" fill="#536779">Malformed offsets stay untrusted</text>

<rect x="56" y="592" width="1208" height="133" rx="15" fill="#fff1df" stroke="#e0b779"/>
<text x="80" y="630" font-size="23" font-weight="700" fill="#755326">Overall compatibility: HOLD</text>
<text x="80" y="668" font-size="19" fill="#755326">Architecture + descriptor selection + preprocessing + trusted state loading + finite numerical parity</text>
<text x="80" y="701" font-size="17" fill="#755326">Those require a separate validated model experiment. No real checkpoint was opened in this tool's fixture tests.</text>
<text x="56" y="758" font-size="15" fill="#536779">Original explanatory diagram. Historical dataset facts are recorded in PROVENANCE.json; this diagram is not a score or runtime measurement.</text>
</g></svg>
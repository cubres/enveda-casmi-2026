<title id="title">Enveda: qualify source identity before interpreting a ranking study</title>
<desc id="desc">Five public datasets supply eighteen pinned consumed files. Scoped roots, canonical identity, complete byte hashes and companion coherence feed unchanged scientific models. CID is checked as builder lineage. V18 completed; fixed placement 0.942 vs joint 0.938 MRR@25 on 16 exposed queries; no official score.</desc>

<g fill="#c2d1df" font-size="18"><text x="80" y="296">18 consumed files</text><text x="80" y="328">owner · slug · version</text><text x="80" y="360">relative file · size · SHA256</text><text x="410" y="296">Scoped root → canonical identity</text><text x="410" y="328">Full streaming hash + path stability</text><text x="410" y="360">Companion alignment + strict failures</text><text x="890" y="296">Same spectra, pool and features</text><text x="890" y="328">8 rankers · fixed versus joint tier</text><text x="890" y="360">16 previously exposed queries</text></g>

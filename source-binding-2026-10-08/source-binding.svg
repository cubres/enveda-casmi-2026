<rect width="1280" height="670" rx="28" fill="url(#bg)"/>
<g font-family="system-ui,-apple-system,sans-serif"><text x="56" y="72" fill="#70d6c4" font-size="17" font-weight="700" letter-spacing="2">ENVEDA · CASMI 2026</text><text x="56" y="122" fill="#f4f7fb" font-size="36" font-weight="700">A filename is not a source identity.</text><text x="56" y="160" fill="#c2d1df" font-size="19">Bind the bytes first. Keep the scientific comparison and its claims separate.</text>
<g stroke="#426278" stroke-width="1.5" fill="#162b3e"><rect x="56" y="220" width="270" height="180" rx="18"/><rect x="386" y="220" width="420" height="180" rx="18"/><rect x="866" y="220" width="358" height="180" rx="18"/></g>

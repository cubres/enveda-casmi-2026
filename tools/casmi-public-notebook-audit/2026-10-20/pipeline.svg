<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="t d"><title id="t">What the V465 audit proves</title><desc id="d">A source-only audit binds the public notebook code and its listed input slugs, while dataset version, license, hidden score, and output remain separate checks.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f4fbfb"/><stop offset="1" stop-color="#e7f0f5"/></linearGradient><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#0f5475"/><stop offset="1" stop-color="#208e9b"/></linearGradient><style>.title{font:700 27px system-ui;fill:#153044}.head{font:700 17px system-ui;fill:#fff}.body{font:14px system-ui;fill:#173446}.muted{font:13px system-ui;fill:#526d7d}.pill{font:700 12px system-ui;fill:#fff}</style></defs><rect width="1120" height="430" rx="24" fill="url(#bg)"/><text x="40" y="48" class="title">A source binding is one useful reproducibility layer</text><text x="40" y="75" class="muted">V465: public score 0.456 · source version 359783615 · 15 listed dataset refs</text><g transform="translate(40 115)"><rect width="235" height="196" rx="18" fill="url(#blue)"/><text x="22" y="38" class="head">1 · Public notebook</text><text x="22" y="73" class="body" fill="#fff">ID + title + source file</text><text x="22" y="101" class="body" fill="#fff">SHA-256 + 35 cells</text><text x="22" y="150" class="pill">CHECKED</text><rect x="20" y="162" width="92" height="22" rx="11" fill="#14705f"/></g><path d="M285 213h37" stroke="#6a8798" stroke-width="3"/><path d="m315 205 10 8-10 8" fill="#6a8798"/><g transform="translate(330 115)"><rect width="235" height="196" rx="18" fill="#256b82"/><text x="22" y="38" class="head">2 · Input catalog</text><text x="22" y="73" class="body" fill="#fff">Competition ref</text><text x="22" y="101" class="body" fill="#fff">15 dataset slugs</text><text x="22" y="150" class="pill">CHECKED</text><rect x="20" y="162" width="92" height="22" rx="11" fill="#14705f"/></g><path d="M575 213h37" stroke="#6a8798" stroke-width="3"/><path d="m605 205 10 8-10 8" fill="#6a8798"/><g transform="translate(620 115)"><rect width="215" height="196" rx="18" fill="#ad7441"/><text x="22" y="38" class="head">3 · Data snapshot</text><text x="22" y="73" class="body" fill="#fff">Version IDs absent</text><text x="22" y="101" class="body" fill="#fff">Hashes not checked</text><text x="22" y="150" class="pill">OPEN</text><rect x="20" y="162" width="70" height="22" rx="11" fill="#865226"/></g><path d="M845 213h37" stroke="#6a8798" stroke-width="3"/><path d="m875 205 10 8-10 8" fill="#6a8798"/><g transform="translate(890 115)"><rect width="190" height="196" rx="18" fill="#6a5a83"/><text x="20" y="38" class="head">4 · Result</text><text x="20" y="73" class="body" fill="#fff">Runtime + output</text><text x="20" y="101" class="body" fill="#fff">Score + licenses</text><text x="20" y="150" class="pill">SEPARATE</text><rect x="18" y="162" width="78" height="22" rx="11" fill="#4d4161"/></g><rect x="40" y="340" width="1040" height="54" rx="13" fill="#fff" stroke="#c8d7de"/><text x="62" y="373" class="body">A green source check does not imply reproducible inputs, rights clearance, a successful rerun, or leaderboard performance.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title description">
  <title id="title">CASMI V6 evidence path to integration review</title>
  <desc id="description">Role-0 structure-uniform training and role-1 checkpoint selection led to metadata projection and an already-consulted role-2 matched comparison against cached V4 predictions. The local result advances to integration review. Role 3 is unused and there is no official score.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#59677b"/></marker>
    <style>text{font-family:system-ui,sans-serif;fill:#17263b}.heading{font-size:17px;font-weight:650}.detail{font-size:13px}.note{font-size:14px}.box{stroke:#b5c4d7;stroke-width:1.5;fill:#f4f7fb}.arrow{stroke:#59677b;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1000" height="280" rx="14" fill="#fff"/>
  <text x="26" y="32" class="heading">Local evidence advances to review</text>
  <rect x="26" y="58" width="210" height="120" rx="10" class="box"/>
  <text x="44" y="84" class="heading">1  Train</text>
  <text x="44" y="109" class="detail">Role 0: uniform structures</text>
  <text x="44" y="130" class="detail">One spectrum per structure</text>
  <text x="44" y="151" class="detail">Role 1 selects checkpoint</text>
  <path d="M 242 118 H 266" class="arrow"/>
  <rect x="276" y="58" width="210" height="120" rx="10" class="box"/>
  <text x="294" y="84" class="heading">2  Project metadata</text>
  <text x="294" y="109" class="detail">Primitive JSON projection</text>
  <text x="294" y="130" class="detail">Exact ordering preserved</text>
  <text x="294" y="151" class="detail">No held-role evaluation</text>
  <path d="M 492 118 H 516" class="arrow"/>
  <rect x="526" y="58" width="220" height="120" rx="10" class="box"/>
  <text x="544" y="84" class="heading">3  Matched selection</text>
  <text x="544" y="109" class="detail">Role 2 already consulted</text>
  <text x="544" y="130" class="detail">V6 0.721630 / V4 0.705582</text>
  <text x="544" y="151" class="detail">Retrospective V4 cache</text>
  <path d="M 752 118 H 776" class="arrow"/>
  <rect x="786" y="58" width="188" height="120" rx="10" fill="#eef8f2" stroke="#79a88b" stroke-width="1.5"/>
  <text x="804" y="84" class="heading">4  Integration review</text>
  <text x="804" y="109" class="detail">Local rule met</text>
  <text x="804" y="130" class="detail">Integration not established</text>
  <text x="804" y="151" class="detail">Role 3 unused</text>
  <text x="26" y="214" class="note">Selection metric: structure-weighted optimistic MRR@25; candidates within ±10 ppm of true pool mass.</text>
  <text x="26" y="241" class="note">Historical numerical parity is unproved. No official submission or score.</text>
</svg>

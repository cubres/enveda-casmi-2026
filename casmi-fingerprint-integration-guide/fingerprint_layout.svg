<rect x="748" y="285" width="72" height="50" fill="#d9eee7" stroke="#467c69"/><text x="784" y="316">key164</text>
<rect x="820" y="285" width="72" height="50" fill="#d9eee7" stroke="#467c69"/><text x="856" y="316">key165</text>
<rect x="892" y="285" width="72" height="50" fill="#d9eee7" stroke="#467c69"/><text x="928" y="316">key166</text>
<rect x="964" y="285" width="72" height="50" fill="#f5dfd8" stroke="#a76650"/><text x="1000" y="316">pad0</text></g>
<text x="36" y="387" font-size="16">Source contract only:array bytes, generator version and checkpoint semantics still need qualification.</text>

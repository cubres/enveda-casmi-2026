<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">CASMI synonym-prior replay</title>
  <desc id="desc">A fixed replay combines pinned cached model scores with public PubChem synonym counts, ranks a shortlist, and measures only a labelled development panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f5f2ed"/><stop offset="1" stop-color="#e8eef3"/></linearGradient>
    <linearGradient id="card" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17324d" flood-opacity=".12"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#66839c"/></marker>
  </defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <text x="56" y="58" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.5" fill="#52718b">CASMI 2026 · REPRODUCIBILITY AUDIT</text>
  <text x="56" y="100" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#16324a">A fixed, credited prior replay</text>
  <text x="56" y="128" font-family="Inter,Arial,sans-serif" font-size="15" fill="#587086">No fitting or inference · pinned public inputs · labelled panel only</text>
  <g filter="url(#shadow)">
    <rect x="55" y="170" width="235" height="174" rx="20" fill="url(#card)"/>
    <rect x="345" y="170" width="235" height="174" rx="20" fill="url(#card)"/>
    <rect x="635" y="170" width="235" height="174" rx="20" fill="url(#card)"/>
    <rect x="925" y="170" width="220" height="174" rx="20" fill="url(#card)"/>
  </g>
  <path d="M300 257h35M590 257h35M880 257h35" stroke="#66839c" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="87" cy="205" r="16" fill="#dce8f2"/><text x="87" y="211" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#28506e">1</text>
  <text x="76" y="245" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#16324a">Pinned evidence</text>
  <text x="76" y="274" font-family="Inter,Arial,sans-serif" font-size="13" fill="#587086">V15 cached scores</text>
  <text x="76" y="296" font-family="Inter,Arial,sans-serif" font-size="13" fill="#587086">PubChem v9 synonyms</text>
  <text x="76" y="318" font-family="Inter,Arial,sans-serif" font-size="13" fill="#587086">SHA-256 input checks</text>
  <circle cx="377" cy="205" r="16" fill="#e7e1f2"/><text x="377" y="211" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#564478">2</text>
  <text x="366" y="245" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#16324a">Fixed feature</text>
  <text x="366" y="274" font-family="Inter,Arial,sans-serif" font-size="13" fill="#587086">prior + 0.5 × log(1 +</text>
  <text x="366" y="296" font-family="Inter,Arial,sans-serif" font-size="13" fill="#587086">synonym count)</text>
  <text x="366" y="318" font-family="Inter,Arial,sans-serif" font-size="13" fill="#587086">weight not tuned here</text>
  <circle cx="667" cy="205" r="16" fill="#dceee7"/><text x="667" y="211" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#2e694f">3</text>
  <text x="656" y="245" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#16324a">Same ranking path</text>
  <text x="656" y="274" font-family="Inter,Arial,sans-serif" font-size="13" fill="#587086">5,000 partial-score</text>
  <text x="656" y="296" font-family="Inter,Arial,sans-serif" font-size="13" fill="#587086">+ 200 prior candidates</text>
  <text x="656" y="318" font-family="Inter,Arial,sans-serif" font-size="13" fill="#587086">identity deduplication</text>
  <circle cx="957" cy="205" r="16" fill="#f4e7d7"/><text x="957" y="211" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8a5d2c">4</text>
  <text x="946" y="245" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#16324a">Panel replay</text>
  <text x="946" y="276" font-family="Inter,Arial,sans-serif" font-size="13" fill="#587086">MRR@25 0.9647 → 0.9703</text>
  <text x="946" y="298" font-family="Inter,Arial,sans-serif" font-size="13" fill="#587086">3 better · 0 worse</text>
  <text x="946" y="322" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#9a6036">NOT a hidden-test score</text>
  <text x="56" y="390" font-family="Inter,Arial,sans-serif" font-size="13" fill="#587086">One cached per-query rank mismatch remains unresolved; aggregate agreement does not establish independent generalization.</text>
</svg>

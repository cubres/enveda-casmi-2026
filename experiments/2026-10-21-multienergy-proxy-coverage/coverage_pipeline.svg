<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">CASMI multi-energy proxy coverage audit</title>
  <desc id="desc">A training-only audit reads the public training parquet, groups spectra by scorer-canonical structure and adduct, records distinct collision-energy settings, and emits aggregate coverage counts for a later blind validation experiment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#17233b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity=".35"/></filter>
    <style>
      .title{font:700 22px Inter,Arial,sans-serif;fill:#f8fafc}.label{font:700 16px Inter,Arial,sans-serif;fill:#e2e8f0}.body{font:14px Inter,Arial,sans-serif;fill:#aebbd0}.tiny{font:12px Inter,Arial,sans-serif;fill:#91a0b9}.arrow{stroke:#8bb8e8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8bb8e8"/></marker>
  </defs>
  <rect width="1120" height="360" rx="28" fill="url(#bg)"/>
  <text x="44" y="50" class="title">Multi-energy proxy coverage · training-only audit</text>
  <text x="44" y="75" class="tiny">Coverage eligibility is measured before any model-quality claim.</text>
  <g filter="url(#shadow)">
    <rect x="44" y="112" width="218" height="176" rx="18" fill="#1c2a43" stroke="#334765"/>
    <rect x="302" y="112" width="218" height="176" rx="18" fill="#1c2a43" stroke="#334765"/>
    <rect x="560" y="112" width="218" height="176" rx="18" fill="#1c2a43" stroke="#334765"/>
    <rect x="818" y="112" width="258" height="176" rx="18" fill="#1c2a43" stroke="#334765"/>
  </g>
  <path d="M264 200 H294" class="arrow"/><path d="M522 200 H552" class="arrow"/><path d="M780 200 H810" class="arrow"/>
  <circle cx="76" cy="150" r="18" fill="url(#accent)"/><text x="71" y="156" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#101827">1</text>
  <circle cx="334" cy="150" r="18" fill="url(#accent)"/><text x="329" y="156" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#101827">2</text>
  <circle cx="592" cy="150" r="18" fill="url(#accent)"/><text x="587" y="156" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#101827">3</text>
  <circle cx="850" cy="150" r="18" fill="url(#accent)"/><text x="845" y="156" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#101827">4</text>
  <text x="104" y="154" class="label">Public training</text>
  <text x="64" y="194" class="body"><tspan x="64" dy="0">train.parquet</tspan><tspan x="64" dy="22">SHA-256 pinned</tspan><tspan x="64" dy="22">No test / predictions</tspan></text>
  <text x="362" y="154" class="label">Scorer identity</text>
  <text x="322" y="194" class="body"><tspan x="322" dy="0">Tautomer canonicalize</tspan><tspan x="322" dy="22">then InChIKey14</tspan><tspan x="322" dy="22">Aliases merged</tspan></text>
  <text x="620" y="154" class="label">Evidence coverage</text>
  <text x="580" y="194" class="body"><tspan x="580" dy="0">Direct [M+H]+</tspan><tspan x="580" dy="22">Ammonium / water-loss</tspan><tspan x="580" dy="22">Distinct CE settings</tspan></text>
  <text x="878" y="154" class="label">Aggregate release</text>
  <text x="838" y="194" class="body"><tspan x="838" dy="0">Counts only · no structures</tspan><tspan x="838" dy="22">Eligibility ≠ score gain</tspan><tspan x="838" dy="22">Next: blind paired MRR@25</tspan></text>
  <text x="44" y="326" class="tiny">Derived aggregates inherit the competition data terms · model inference and leaderboard scoring are outside this audit</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Permanent submission intent contract</title><desc id="desc">Complete qualification before an exclusive synced intent. Call a no-retry request adapter once, then retain accepted or unknown evidence. All later calls hold and require read-only reconciliation.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#9bb4c6" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="600" rx="24" fill="#102231"/>
<g fill="#eef6fa" font-family="system-ui,sans-serif"><text x="54" y="62" font-size="28" font-weight="700">One admitted request. Permanent evidence.</text><text x="54" y="97" font-size="17" fill="#b2c8d5">A local latch complements qualification and exact server-row verification.</text></g>
<g stroke="#365769" stroke-width="2" fill="#1b3546"><rect x="54" y="148" width="244" height="142" rx="16"/><rect x="363" y="148" width="244" height="142" rx="16"/><rect x="674" y="148" width="244" height="142" rx="16"/><rect x="674" y="369" width="450" height="146" rx="16"/></g>
<g font-family="system-ui,sans-serif" fill="#eef6fa" font-size="20" font-weight="650"><text x="77" y="185">Qualify first</text><text x="386" y="185">Retain intent</text><text x="697" y="185">Invoke once</text><text x="699" y="408">Read the exact server row</text></g>
<g font-family="system-ui,sans-serif" fill="#b9cfdd" font-size="16"><text x="77" y="219">Identity • native output</text><text x="77" y="246">Science • runtime • quota</text><text x="386" y="219">Exclusive create + file sync</text><text x="386" y="246">Directory sync before request</text><text x="697" y="219">Reviewed no-retry adapter</text><text x="697" y="246">No remote calls in this tool</text><text x="699" y="447">Accepted reference: still unscored</text><text x="699" y="476">Exception or missing receipt: unknown</text></g>
<g stroke="#9bb4c6" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M298 219H363"/><path d="M607 219H674"/><path d="M796 290V369"/><path d="M485 290V442H674"/></g>
<g font-family="system-ui,sans-serif"><text x="55" y="369" fill="#f0cc96" font-size="22" font-weight="650">Existing or partial intent → HOLD</text><text x="55" y="405" fill="#b9cfdd" font-size="17">Changed hash cannot escape the frozen-version key.</text><text x="55" y="547" fill="#b9cfdd" font-size="17">Shared persistent storage required. No reset, deletion or automatic retry.</text></g>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">Native retrieval gate: 0 of 400 groups opened</title>
<desc id="desc">The completed native development run processed 400 groups. The retrieval gate opened for none. No natural forward fallback activation occurred. Ranking gains were not measured.</desc>
<rect width="1000" height="410" rx="18" fill="#f7f8fc"/>
<g font-family="Arial, sans-serif" fill="#172033">
<text x="48" y="53" font-size="26" font-weight="700">A completed run can leave the intervention untested</text>
<text x="48" y="85" font-size="16" fill="#526074">Native development capture · aggregate evidence only</text>
<rect x="48" y="124" width="260" height="156" rx="12" fill="#e8eef9" stroke="#bccae4"/>
<rect x="370" y="124" width="260" height="156" rx="12" fill="#fce9dc" stroke="#dfb998"/>
<rect x="692" y="124" width="260" height="156" rx="12" fill="#e9edf1" stroke="#b8c4cf"/>
<text x="178" y="178" text-anchor="middle" font-size="46" font-weight="700">400</text>
<text x="178" y="216" text-anchor="middle" font-size="18">native groups processed</text>
<text x="178" y="246" text-anchor="middle" font-size="14" fill="#526074">terminal capture complete</text>
<text x="500" y="178" text-anchor="middle" font-size="46" font-weight="700">0 / 400</text>
<text x="500" y="216" text-anchor="middle" font-size="18">retrieval gates opened</text>
<text x="500" y="246" text-anchor="middle" font-size="14" fill="#526074">unchanged native gate</text>
<text x="822" y="178" text-anchor="middle" font-size="46" font-weight="700">0</text>
<text x="822" y="216" text-anchor="middle" font-size="18">natural activations</text>
<text x="822" y="246" text-anchor="middle" font-size="14" fill="#526074">fallback effect unmeasured</text>
<path d="M319 202h36m-10-7 10 7-10 7M641 202h36m-10-7 10 7-10 7" fill="none" stroke="#617086" stroke-width="3"/>
<text x="48" y="326" font-size="18" font-weight="700">No measured ranking gain or independent treatment comparison.</text>
<text x="48" y="354" font-size="16" fill="#526074">A separate readiness canary does not measure the intervention's effect.</text>
<text x="48" y="382" font-size="14" fill="#526074">Next: preregister a private reference-library holdout and retain every outcome.</text>
</g></svg>
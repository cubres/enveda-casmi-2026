<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
<title id="title">Reference exact-mass ambiguity atlas</title><desc id="desc">A public reference-only pipeline retains all 4096 queries. 1262 have 10 ppm confusers, 359 use 30 ppm fallback, and 2475 remain empty. The output has 3800 directed pairs.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5f2fa"/><stop offset="1" stop-color="#eaf5f1"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#5e6c7b"/></marker></defs>
<rect width="1500" height="760" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif" fill="#142437">
<text x="72" y="88" font-size="40" font-weight="700">The ambiguity is in the references</text><text x="74" y="127" font-size="21" fill="#526477">4,096 ChEBI structures · 4,092 public canonical groups · exact binary similarities</text>
<g stroke="#5e6c7b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M370 272H408"/><path d="M720 272H758"/><path d="M1070 272H1108"/></g>
<g><rect x="72" y="188" width="298" height="168" rx="20" fill="#ffffff"/><text x="98" y="228" font-size="17" fill="#6852a0">PUBLIC STRUCTURE INPUT</text><text x="98" y="270" font-size="23" font-weight="700">Reference exact mass</text><text x="98" y="307" font-size="19" fill="#526477">No spectra or targets</text></g>
<g><rect x="408" y="188" width="312" height="168" rx="20" fill="#ffffff"/><text x="434" y="228" font-size="17" fill="#6852a0">DIRECTED WINDOW</text><text x="434" y="270" font-size="25" font-weight="700">10 ppm → 30 if empty</text><text x="434" y="307" font-size="19" fill="#526477">Exclude equal groups first</text></g>
<g><rect x="758" y="188" width="312" height="168" rx="20" fill="#ffffff"/><text x="784" y="228" font-size="17" fill="#17785f">BOUNDED BITSET MATH</text><text x="784" y="270" font-size="27" font-weight="700">10,395 selected bits</text><text x="784" y="307" font-size="19" fill="#526477">Exact counts; Jaccard / cosine</text></g>
<g><rect x="1108" y="188" width="320" height="168" rx="20" fill="#183d42"/><text x="1134" y="228" font-size="17" fill="#b9dfd2">COMPLETE OUTPUT</text><text x="1134" y="274" font-size="38" font-weight="700" fill="#ffffff">3,800</text><text x="1134" y="313" font-size="20" fill="#e2f2ed">directed confuser pairs</text></g>
<text x="74" y="424" font-size="23" font-weight="700">Every reference row remains visible</text>
<g><rect x="72" y="458" width="430" height="146" rx="18" fill="#e0d9ef"/><text x="98" y="514" font-size="39" font-weight="700">1,262</text><text x="98" y="554" font-size="23">10 ppm confusers</text><text x="98" y="582" font-size="17" fill="#526477">All different-group peers retained</text></g>
<g><rect x="534" y="458" width="430" height="146" rx="18" fill="#cfe8de"/><text x="560" y="514" font-size="39" font-weight="700">359</text><text x="560" y="554" font-size="23">30 ppm fallback</text><text x="560" y="582" font-size="17" fill="#526477">Only when no 10 ppm peer remains</text></g>
<g><rect x="996" y="458" width="432" height="146" rx="18" fill="#e5e9ed"/><text x="1022" y="514" font-size="39" font-weight="700">2,475</text><text x="1022" y="554" font-size="23">Empty neighborhoods</text><text x="1022" y="582" font-size="17" fill="#526477">Kept in the 4,096-row query table</text></g>
<path d="M74 652H1426" stroke="#b6c7cc"/><text x="74" y="691" font-size="20" fill="#526477">Reference structures only · no MS2 recall, model-quality or score claim</text><text x="74" y="722" font-size="17" fill="#6b7b8a">Measured counts: completed atlas and independent pair-policy audit · 20 October 2026</text>
</g></svg>